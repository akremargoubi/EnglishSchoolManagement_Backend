apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: esm
spec:
  serviceName: auth-db-svc
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: esmauthdb
            - name: POSTGRES_USER
              value: authserviceuser
            - name: POSTGRES_PASSWORD
              value: authservicedbp4ss
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
