# ── H2 in-memory (replaces PostgreSQL for tests) ──────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── Disable Eureka ────────────────────────────────────────────────────────────
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ── Mailjet (stub values — HTTP calls are mocked in tests) ───────────────────
mailjet.api-key=test-api-key
mailjet.secret-key=test-secret-key
mailjet.sender-email=noreply@test.com
mailjet.sender-name=Test ESM
