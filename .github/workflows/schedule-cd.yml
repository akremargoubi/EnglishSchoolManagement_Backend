name: Schedule Service CD

on:
  push:
    branches: [ rayen ]
    paths:
      - 'schedule-service/**'

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build JAR
        run: |
          cd schedule-service
          mvn clean package -DskipTests
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./schedule-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/schedule-service:latest
            ${{ secrets.DOCKER_USERNAME }}/schedule-service:${{ github.sha }}
      
      - name: Log deployment
        run: echo "Schedule service Docker image pushed!"