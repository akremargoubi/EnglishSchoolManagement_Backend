# ── H2 in-memory (replaces PostgreSQL for tests) ──────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── Disable Eureka (no service discovery in CI) ───────────────────────────────
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=testsecretkeytestsecretkeytestsecretkey12345
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=3600000

# ── Email service (mocked in tests) ──────────────────────────────────────────
email.service.url=http://localhost:19999/api/emails/send

# ── S3 disabled in tests ──────────────────────────────────────────────────────
app.storage.s3.enabled=false
app.storage.avatar-dir=/tmp/avatars-test
app.storage.s3.endpoint=
app.storage.s3.region=us-east-1
app.storage.s3.bucket=test
app.storage.s3.access-key=test
app.storage.s3.secret-key=test
app.storage.s3.public-url-prefix=http://localhost/avatars
