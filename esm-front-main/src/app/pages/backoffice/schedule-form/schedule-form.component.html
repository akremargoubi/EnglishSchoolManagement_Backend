<div class="bg-white rounded-2xl border border-gray-200 p-6">
  <h3 class="text-xl font-semibold text-gray-900 mb-6">
    {{ isEdit ? 'Edit' : 'New' }} Schedule
  </h3>
  
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Day</label>
      <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <option *ngFor="let day of days">{{day}}</option>
      </select>
    </div>
    
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Start Time</label>
        <input type="time" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">End Time</label>
        <input type="time" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
      </div>
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Room</label>
      <input type="text" placeholder="e.g., A101" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Course</label>
      <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <option>Beginner English</option>
        <option>Intermediate Conversation</option>
        <option>Advanced Business</option>
        <option>IELTS Preparation</option>
      </select>
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Teacher</label>
      <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <option>Sarah Johnson</option>
        <option>Michael Lee</option>
        <option>Emily Clark</option>
      </select>
    </div>
    
    <div class="flex gap-3 pt-4">
      <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90">
        {{ isEdit ? 'Update' : 'Create' }}
      </button>
      <button type="button" routerLink="/backoffice" class="border border-gray-300 px-6 py-2 rounded-lg hover:bg-gray-50">
        Cancel
      </button>
    </div>
  </form>
</div>
