<div class="bg-white rounded-2xl border border-gray-200 p-6">
  <h3 class="text-xl font-semibold text-gray-900 mb-6">
    {{ isEdit ? 'Edit' : 'New' }} Attendance Record
  </h3>
  
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Student</label>
      <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <option>Emma Watson</option>
        <option>James Smith</option>
        <option>Maria Garcia</option>
      </select>
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
      <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
      <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <option>PRESENT</option>
        <option>ABSENT</option>
        <option>LATE</option>
      </select>
    </div>
    
    <div class="flex gap-3 pt-4">
      <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90">
        {{ isEdit ? 'Update' : 'Create' }}
      </button>
      <button type="button" routerLink="/backoffice" class="border border-gray-300 px-6 py-2 rounded-lg hover:bg-gray-50">
        Cancel
      </button>
    </div>
  </form>
</div>
