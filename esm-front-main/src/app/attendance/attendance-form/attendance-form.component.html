<div class="container mx-auto p-6 max-w-2xl">
  <div class="bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold text-darkindigo mb-6">
      {{ isEdit ? 'Edit' : 'Add' }} Attendance Record
    </h1>

    <form (ngSubmit)="onSubmit()" #attendanceForm="ngForm">
      
      <!-- Select Class -->
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Select Class</label>
        <select
          [(ngModel)]="selectedClassId"
          name="classId"
          (change)="onClassChange()"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary"
        >
          <option [ngValue]="null">-- Select a Class --</option>
          <option *ngFor="let class of classes" [ngValue]="class.id">
            {{ class.name }} - {{ class.level }}
          </option>
        </select>
      </div>

      <!-- Select Student -->
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Select Student</label>
        <select
          [(ngModel)]="selectedStudent"
          name="studentId"
          (change)="onStudentChange()"
          [disabled]="!selectedClassId"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary"
        >
          <option [ngValue]="null">-- Select a Student --</option>
          <option *ngFor="let student of students" [ngValue]="student">
            {{ getStudentName(student) }} ({{ student.cin || 'No CIN' }})
          </option>
        </select>
      </div>

      <!-- Selected Student Info -->
      <div *ngIf="selectedStudent" class="mb-4 p-3 bg-gray-50 rounded-lg">
        <p class="text-sm"><strong>Student:</strong> {{ selectedStudent.firstName }} {{ selectedStudent.lastName }}</p>
        <p class="text-sm"><strong>Email:</strong> {{ selectedStudent.email }}</p>
        <p class="text-sm" *ngIf="selectedStudent.cin"><strong>CIN:</strong> {{ selectedStudent.cin }}</p>
      </div>

      <!-- Date -->
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Date</label>
        <input
          type="date"
          [(ngModel)]="attendance.date"
          name="date"
          required
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary"
        >
      </div>

      <!-- Status -->
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Status</label>
        <select
          [(ngModel)]="attendance.status"
          name="status"
          required
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary"
        >
          <option value="PRESENT">Present ✅</option>
          <option value="ABSENT">Absent ❌</option>
          <option value="LATE">Late ⏰</option>
        </select>
      </div>

      <!-- Actions -->
      <div class="flex justify-end space-x-3">
        <button
          type="button"
          routerLink="/attendance"
          class="px-4 py-2 border rounded-lg hover:bg-gray-100"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="!attendanceForm.form.valid || loading || !selectedStudent"
          class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-secondary disabled:opacity-50"
        >
          {{ loading ? 'Saving...' : (isEdit ? 'Update' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
